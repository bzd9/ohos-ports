<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@ohos-ports 包查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:28px;color:#1a1a2e;margin-bottom:8px}
.header p{color:#666;font-size:14px}
.header a{color:#4f46e5;text-decoration:none}
.stats{display:flex;justify-content:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;max-width:600px;margin-left:auto;margin-right:auto}
.stat{background:#fff;border-radius:8px;padding:16px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat .num{font-size:22px;font-weight:700;color:#4f46e5}
.stat .label{font-size:11px;color:#999;margin-top:4px}
.stat.deprecated .num{color:#dc2626}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:20px;max-width:600px;margin-left:auto;margin-right:auto;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:2px solid #e0e0e0;background:#fff;color:#555}
.tab.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.search-box{position:relative;margin-bottom:24px;max-width:600px;margin-left:auto;margin-right:auto}
.search-box input{width:100%;padding:14px 16px 14px 44px;font-size:16px;border:2px solid #e0e0e0;border-radius:8px;outline:none;background:#fff}
.search-box input:focus{border-color:#4f46e5}
.search-box .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#999}
.result-info{margin-bottom:12px;font-size:13px;color:#888;max-width:600px;margin-left:auto;margin-right:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 auto}
th{background:#f8f9fb;padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:#555;border-bottom:1px solid #eee;position:sticky;top:0}
td{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;vertical-align:top}
tr:hover{background:#fafbfc}
.pkg-name{font-family:monospace;font-weight:500;white-space:nowrap}
.pkg-name a{color:#4f46e5;text-decoration:none}
.pkg-name a:hover{text-decoration:underline}
.pkg-ver{font-family:monospace;font-size:13px;white-space:nowrap}
.pkg-ver.stable{color:#059669}
.pkg-ver.beta{color:#92400e}
.pkg-ver.none{color:#ccc}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-ci{background:#dbeafe;color:#1e40af}
.badge-local{background:#f3f4f6;color:#6b7280}
.badge-deprecated{background:#fee2e2;color:#dc2626}
.badge-deprecated:hover{cursor:help}
.install-cmd{font-family:monospace;font-size:11px;background:#f5f5f5;padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
.pagination button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;cursor:pointer;font-size:14px;color:#555}
.pagination button:hover:not(:disabled){background:#4f46e5;color:#fff;border-color:#4f46e5}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:#888}
.footer{text-align:center;margin-top:32px;font-size:12px;color:#aaa}
.footer a{color:#4f46e5;text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>@ohos-ports 包查询</h1>
    <p>需鸿蒙化编译适配的 npm 包，统一发布在 <code>@ohos-ports</code> scope 下</p>
  </div>
  <div class="stats" id="stats"><div class="stat"><div class="num">-</div><div class="label">加载中</div></div></div>
  <div class="tabs">
    <div class="tab active" data-filter="all" onclick="switchTab('all')">全部</div>
    <div class="tab" data-filter="CI发布" onclick="switchTab('CI发布')">CI发布</div>
    <div class="tab" data-filter="本地发布" onclick="switchTab('本地发布')">本地发布</div>
    <div class="tab" data-filter="deprecated" onclick="switchTab('deprecated')">已废弃</div>
  </div>
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="search" placeholder="输入包名搜索..." autocomplete="off">
  </div>
  <div class="result-info" id="info"></div>
  <table id="table">
    <thead><tr><th>包名</th><th>正式版本</th><th>Beta版本</th><th>来源</th><th>状态</th><th>安装</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pagination" id="pagination" style="display:none">
    <button id="prevPage" onclick="changePage(-1)">上一页</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextPage" onclick="changePage(1)">下一页</button>
  </div>
  <div class="footer">
    数据通过 <a href="https://registry.npmjs.org" target="_blank">npm Registry API</a> 获取 |
    <a href="https://github.com/ohos-ports/ohos-ports" target="_blank">GitHub 仓库</a>
    <span id="updated"></span>
  </div>
</div>
<script>
var indexData = null;
var allPackages = [];
var currentFilter = 'all';
var currentPage = 1;
var pageSize = 100;
var currentData = [];

async function loadData() {
  try {
    var resp = await fetch('data/index.json');
    indexData = await resp.json();
    document.getElementById('updated').textContent = ' · 更新日期：' + indexData.last_updated;
    renderStats();

    // 加载 jsonl
    var resp2 = await fetch('data/packages.jsonl');
    var text = await resp2.text();
    var lines = text.trim().split('\n');
    allPackages = [];
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim()) {
        try { allPackages.push(JSON.parse(lines[i])); } catch(e) {}
      }
    }
    renderTable();
  } catch(e) {
    document.getElementById('info').textContent = '加载数据失败: ' + e.message;
  }
}

function renderStats() {
  var html =
    '<div class="stat"><div class="num">' + indexData.total + '</div><div class="label">已发布包</div></div>' +
    '<div class="stat"><div class="num">' + indexData.ci_count + '</div><div class="label">CI发布</div></div>' +
    '<div class="stat"><div class="num">' + indexData.local_count + '</div><div class="label">本地发布</div></div>';
  if (indexData.deprecated_count) {
    html += '<div class="stat deprecated"><div class="num">' + indexData.deprecated_count + '</div><div class="label">已废弃</div></div>';
  }
  document.getElementById('stats').innerHTML = html;
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function getFiltered() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  var filtered = [];
  for (var i = 0; i < allPackages.length; i++) {
    var p = allPackages[i];
    if (currentFilter === 'deprecated') {
      if (!p.deprecated) continue;
    } else if (currentFilter !== 'all' && p.source !== currentFilter) {
      continue;
    }
    if (q) {
      if (p.name.toLowerCase().indexOf(q) === -1 &&
          (p.short_name || '').toLowerCase().indexOf(q) === -1 &&
          (!p.description || p.description.toLowerCase().indexOf(q) === -1)) continue;
    }
    filtered.push(p);
  }
  return filtered;
}

function renderTable() {
  currentData = getFiltered();
  currentPage = 1;
  renderPage();
}

function renderPage() {
  var data = currentData;
  var tbody = document.getElementById('tbody');
  var info = document.getElementById('info');
  var pagination = document.getElementById('pagination');

  if (!data.length) {
    tbody.innerHTML = '';
    info.textContent = '未找到匹配的包';
    pagination.style.display = 'none';
    return;
  }

  var totalPages = Math.ceil(data.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  var start = (currentPage - 1) * pageSize;
  var end = Math.min(start + pageSize, data.length);
  var disp = data.slice(start, end);

  var html = '';
  for (var i = 0; i < disp.length; i++) {
    var p = disp[i];
    var stable = p.stable_version
      ? '<span class="pkg-ver stable">' + esc(p.stable_version) + '</span>'
      : '<span class="pkg-ver none">—</span>';
    var beta = p.beta_version
      ? '<span class="pkg-ver beta">' + esc(p.beta_version) + '</span>'
      : '<span class="pkg-ver none">—</span>';
    var badge = p.source === 'CI发布'
      ? '<span class="badge badge-ci">CI发布</span>'
      : '<span class="badge badge-local">本地发布</span>';
    var status = p.deprecated
      ? '<span class="badge badge-deprecated" title="' + esc(p.deprecated_message) + '">已废弃</span>'
      : '<span class="badge badge-normal">正常</span>';

    html += '<tr>' +
      '<td class="pkg-name"><a href="' + esc(p.npm_url) + '" target="_blank">' + esc(p.name) + '</a></td>' +
      '<td>' + stable + '</td>' +
      '<td>' + beta + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + status + '</td>' +
      '<td><span class="install-cmd" onclick="copyText(\'npm i ' + esc(p.name) + '\')">npm i ' + esc(p.short_name) + '</span></td>' +
      '</tr>';
  }

  tbody.innerHTML = html;
  info.textContent = '共 ' + data.length + ' 个包（第 ' + currentPage + '/' + totalPages + ' 页，当前 ' + disp.length + ' 条）';

  pagination.style.display = totalPages > 1 ? 'flex' : 'none';
  document.getElementById('prevPage').disabled = (currentPage <= 1);
  document.getElementById('nextPage').disabled = (currentPage >= totalPages);
  document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages;
}

function changePage(delta) {
  var totalPages = Math.ceil(currentData.length / pageSize);
  currentPage += delta;
  if (currentPage < 1) currentPage = 1;
  if (currentPage > totalPages) currentPage = totalPages;
  renderPage();
  window.scrollTo(0, 0);
}

function copyText(text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text);
}

function switchTab(filter) {
  currentFilter = filter;
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-filter') === filter);
  }
  renderTable();
}

document.getElementById('search').addEventListener('input', function() {
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(renderTable, 200);
});

loadData();
</script>
</body>
</html>
